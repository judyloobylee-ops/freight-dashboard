<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수출입 해상운임 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0E2A3D;
    --navy-deep:#081C29;
    --teal:#1C8C8C;
    --teal-light:#E4F4F3;
    --amber:#E2A63B;
    --up:#C1443D;
    --down:#2E8B57;
    --bg:#F4F7F8;
    --surface:#FFFFFF;
    --border:#DFE6E9;
    --text:#14232B;
    --text-soft:#64798A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* Header */
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:20; border-bottom:2px solid var(--teal);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .icon{
    width:34px; height:34px; border-radius:8px; background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
  }
  .brand h1{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; margin:0;}
  .brand p{margin:1px 0 0; font-size:11px; color:#9FB4C4;}
  .header-period{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:8px; padding:7px 14px; font-size:12px; color:#CFE3EA;
  }
  .header-period b{color:#fff; font-family:'JetBrains Mono',monospace; font-weight:600;}

  /* Layout */
  .layout{display:flex; align-items:flex-start;}

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    height:calc(100vh - 62px); overflow-y:auto; position:sticky; top:62px;
  }
  .region-block{border-bottom:1px solid #EEF2F4;}
  .region-head{
    display:flex; align-items:center; justify-content:space-between; padding:11px 16px;
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text);
  }
  .region-head:hover{background:#F8FAFB;}
  .region-head .rname{display:flex; align-items:center; gap:8px;}
  .badge{
    background:var(--navy); color:#fff; font-size:11px; padding:1px 8px; border-radius:999px;
    font-family:'JetBrains Mono',monospace; min-width:20px; text-align:center;
  }
  .region-head .caret{font-size:10px; color:var(--text-soft); transition:transform .15s;}
  .region-block.expanded .caret{transform:rotate(180deg);}
  .pod-list{display:none; padding-bottom:6px;}
  .region-block.expanded .pod-list{display:block;}
  .pod-item{
    display:flex; justify-content:space-between; align-items:center; padding:8px 16px 8px 30px;
    font-size:12.5px; color:var(--text-soft); cursor:pointer;
  }
  .pod-item:hover{background:var(--teal-light); color:var(--text);}
  .pod-item.active{background:var(--teal-light); color:var(--teal); font-weight:600; border-right:3px solid var(--teal);}
  .pod-item .badge{background:#EEF2F4; color:var(--text-soft); font-size:10.5px;}
  .pod-item.active .badge{background:var(--teal); color:#fff;}

  /* Main */
  .main{flex:1; padding:18px 24px 60px; min-width:0;}

  .toolbar{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 16px; display:flex; gap:22px; align-items:center; margin-bottom:16px;
    box-shadow:0 2px 8px rgba(14,42,61,0.04);
  }
  .toolbar .group{display:flex; align-items:center; gap:10px;}
  .toolbar label{font-size:12px; color:var(--text-soft); font-weight:600;}
  .toggle{display:flex; gap:3px; background:#EEF2F4; padding:3px; border-radius:8px;}
  .toggle button{
    border:none; background:transparent; padding:6px 16px; font-size:13px; border-radius:6px;
    cursor:pointer; color:var(--text-soft); font-weight:600; font-family:'Inter',sans-serif;
  }
  .toggle button.active{background:var(--navy); color:#fff;}

  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 18px; box-shadow:0 2px 8px rgba(14,42,61,0.04);}
  .card .label{font-size:11.5px; color:var(--text-soft); margin-bottom:6px;}
  .card .value{font-family:'Space Grotesk',sans-serif; font-size:23px; font-weight:700; color:var(--navy);}
  .card .sub{font-size:11.5px; margin-top:4px; color:var(--text-soft);}
  .card .sub.up{color:var(--up);} .card .sub.down{color:var(--down);}
  .card .sub b{font-family:'JetBrains Mono',monospace;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 2px 8px rgba(14,42,61,0.04); margin-bottom:18px;}
  .panel-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .panel-head h2{font-family:'Space Grotesk',sans-serif; font-size:14.5px; margin:0; color:var(--navy);}
  .panel-head .tag{font-size:11.5px; background:var(--teal-light); color:var(--teal); padding:3px 10px; border-radius:999px; font-family:'JetBrains Mono',monospace;}
  .chart-wrap{padding:16px 18px; height:280px;}

  .detail-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; padding:16px 18px;}
  .rate-card{border:1px solid var(--border); border-radius:9px; overflow:hidden;}
  .rate-card .rc-head{
    background:#F8FAFB; padding:9px 12px; display:flex; align-items:center; justify-content:space-between; gap:6px;
    border-bottom:1px solid var(--border);
  }
  .rc-line{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:var(--navy);}
  .rc-tags{display:flex; gap:5px; align-items:center;}
  .rc-tag{font-size:10px; padding:2px 7px; border-radius:999px; background:#EEF2F4; color:var(--text-soft); white-space:nowrap;}
  .rc-tag.best{background:var(--down); color:#fff;}
  .rc-body{padding:12px;}
  .rc-sec-label{font-size:10.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .rc-prices{display:flex; gap:8px; margin-bottom:10px;}
  .rc-price-box{flex:1; background:var(--teal-light); border-radius:7px; padding:8px; text-align:center;}
  .rc-price-box .u{font-size:10px; color:var(--text-soft);}
  .rc-price-box .v{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--navy);}
  .rc-remark{font-size:11px; color:var(--text-soft); background:#F8FAFB; border-left:3px solid var(--teal); padding:7px 9px; line-height:1.55;}

  .empty-state{padding:40px; text-align:center; color:var(--text-soft); font-size:13px;}

  footer{text-align:center; padding:20px; color:var(--text-soft); font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5FC7C4" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
    </div>
    <div>
      <h1>수출입 해상운임 대시보드</h1>
      <p>Ocean Freight Rate Dashboard</p>
    </div>
  </div>
  <div class="header-period" id="headerPeriod"></div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main">
    <div class="toolbar">
      <div class="group">
        <label>출발항</label>
        <div class="toggle" id="polToggle">
          <button data-val="부산착" class="active">부산</button>

      </div>
      <div class="group">
        <label>컨테이너</label>

          <button data-val="r20" class="active">20ft</button>
          <button data-val="r40">40ft</button>
        </div>
      </div>
    </div>

    <div class="cards" id="summaryCards"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>선사별 선임 추이</h2>
        <span class="tag" id="chartTag">-</span>
      </div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>최신 운임 상세</h2>
        <span class="tag" id="detailTag">-</span>
      </div>
      <div class="detail-grid" id="detailGrid"></div>
    </div>
  </div>
</div>

<footer>일양익스프레스 해운팀 · 데이터 기준 2026년 1월~7월 (부산/인천 수입 운임)</footer>

<script>
const RAW = JSON.parse(document.getElementById('freight-data').textContent);
const REGION_ORDER = ['중국','일본','동남아','서남아','중동','유럽','북미','남미'];
const CARRIER_COLORS = ['#1C8C8C','#0E2A3D','#E2A63B','#C1443D','#6C3B9E','#2E8B57','#1B5C8C','#B15C1E','#8C5C1C','#4A6C6C','#9E3B6C','#3B6C9E'];

const halfOrder = {'상':0,'하':1};
function periodKey(r){ return r.ym+'-'+r.half; }
function periodSort(a,b){ if(a.ym!==b.ym) return a.ym.localeCompare(b.ym); return halfOrder[a.half]-halfOrder[b.half]; }
function periodLabel(p){ return `${parseInt(p.ym.slice(5))}월${p.half}`; }

const periods = [...new Map(RAW.map(r=>[periodKey(r),{ym:r.ym,half:r.half}])).values()].sort(periodSort);
const latest = periods[periods.length-1];
const earliest = periods[0];
document.getElementById('headerPeriod').innerHTML = `<b>${periodLabel(earliest)} – ${periodLabel(latest)}</b> &nbsp;|&nbsp; 생성: 2026-07-21`;

let state = { pol:'부산착', container:'r20', region:null, pod:null };

function latestRowsFor(pol){ return RAW.filter(r=> r.section===pol && periodKey(r)===`${latest.ym}-${latest.half}`); }

function buildSidebar(){
  const rows = latestRowsFor(state.pol);
  const byRegion = {};
  rows.forEach(r=>{
    byRegion[r.region] = byRegion[r.region] || {};
    byRegion[r.region][r.pod] = byRegion[r.region][r.pod] || new Set();
    byRegion[r.region][r.pod].add(r.line);
  });
  const regionsPresent = REGION_ORDER.filter(reg=>byRegion[reg]);

  if(!state.region || !byRegion[state.region]){ state.region = regionsPresent[0]; }
  const podsInRegion = Object.keys(byRegion[state.region]||{}).sort();
  if(!state.pod || !byRegion[state.region][state.pod]){ state.pod = podsInRegion[0]; }

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = regionsPresent.map(reg=>{
    const pods = Object.keys(byRegion[reg]).sort();
    const expanded = reg===state.region;
    return `<div class="region-block ${expanded?'expanded':''}" data-region="${reg}">
      <div class="region-head">
        <span class="rname">${reg}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="badge">${pods.length}</span>
          <span class="caret">▾</span>
        </span>
      </div>
      <div class="pod-list">
        ${pods.map(pod=>{
          const active = expanded && pod===state.pod;
          return `<div class="pod-item ${active?'active':''}" data-region="${reg}" data-pod="${pod}">
            <span>${pod}</span><span class="badge">${byRegion[reg][pod].size}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  sidebar.querySelectorAll('.region-head').forEach(el=>{
    el.addEventListener('click', ()=>{
      const block = el.closest('.region-block');
      const reg = block.dataset.region;
      if(state.region===reg){ return; } // already expanded/selected - keep
      state.region = reg;
      const podsInReg = Object.keys(byRegion[reg]).sort();
      state.pod = podsInReg[0];
      renderAll();
    });
  });
  sidebar.querySelectorAll('.pod-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.region = el.dataset.region;
      state.pod = el.dataset.pod;
      renderAll();
    });
  });
}

function avg(arr){ const n=arr.filter(v=>typeof v==='number'); return n.length? n.reduce((a,b)=>a+b,0)/n.length : null; }

function renderCards(){
  const podRows = RAW.filter(r=> r.section===state.pol && r.region===state.region && r.pod===state.pod);
  const podPeriods = [...new Map(podRows.map(r=>[periodKey(r),{ym:r.ym,half:r.half}])).values()].sort(periodSort);
  if(podPeriods.length===0){ document.getElementById('summaryCards').innerHTML=''; return; }
  const firstP = podPeriods[0], lastP = podPeriods[podPeriods.length-1];
  const firstRows = podRows.filter(r=>periodKey(r)===`${firstP.ym}-${firstP.half}`);
  const lastRows = podRows.filter(r=>periodKey(r)===`${lastP.ym}-${lastP.half}`);
  const firstAvg = avg(firstRows.map(r=>r[state.container]));
  const lastAvg = avg(lastRows.map(r=>r[state.container]));

  let changeHtml = '<span class="sub">비교 불가</span>';
  if(firstAvg!==null && lastAvg!==null){
    const diff = lastAvg-firstAvg;
    if(Math.abs(diff)<0.01){ changeHtml = '<span class="sub">변동없음</span>'; }
    else{
      const pct = (diff/firstAvg*100).toFixed(1);
      const cls = diff>0?'up':'down';
      changeHtml = `<span class="sub ${cls}">${diff>0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
    }
  }

  const numericLast = lastRows.filter(r=>typeof r[state.container]==='number');
  let minCard = '-', maxCard = '-';
  if(numericLast.length){
    const minR = numericLast.reduce((a,b)=> a[state.container]<=b[state.container]?a:b);
    const maxR = numericLast.reduce((a,b)=> a[state.container]>=b[state.container]?a:b);
    minCard = `${minR.line}<div class="sub" style="color:var(--down)">$${minR[state.container]}</div>`;
    maxCard = `${maxR.line}<div class="sub" style="color:var(--up)">$${maxR[state.container]}</div>`;
  }

  const cards = [
    {label:`초기(${periodLabel(firstP)})`, value: firstAvg? '$'+Math.round(firstAvg) : '-', sub:''},
    {label:`최신(${periodLabel(lastP)})`, value: lastAvg? '$'+Math.round(lastAvg) : '-', sub:changeHtml},
    {label:'최저가 선사', value: minCard, sub:''},
    {label:'최고가 선사', value: maxCard, sub:''}
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(c=>`
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value" style="font-size:${c.label.includes('선사')?'15px':'23px'};">${c.value}</div>
      ${c.sub}
    </div>`).join('');
}

let chartInstance = null;
function renderChart(){
  const podRows = RAW.filter(r=> r.section===state.pol && r.region===state.region && r.pod===state.pod);
  const linesInPod = [...new Set(podRows.map(r=>r.line))].sort();
  const contLabel = state.container==='r20' ? '20FT':'40FT';
  document.getElementById('chartTag').textContent = `${state.region} / ${state.pod} (${state.pol==='부산착'?'부산발':'인천발'}, ${contLabel}) USD`;

  const datasets = linesInPod.map((line,i)=>{
    const data = periods.map(p=>{
      const row = podRows.find(r=> r.line===line && periodKey(r)===`${p.ym}-${p.half}`);
      return row && typeof row[state.container]==='number' ? row[state.container] : null;
    });
    return { label: line, data, borderColor: CARRIER_COLORS[i%CARRIER_COLORS.length], backgroundColor: CARRIER_COLORS[i%CARRIER_COLORS.length], tension:0.25, spanGaps:true };
  });

  if(chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('trendChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels: periods.map(periodLabel), datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, boxWidth:10 } } },
      scales:{ y:{ ticks:{ font:{size:10}, callback:v=>'$'+v } }, x:{ ticks:{ font:{size:10} } } }
    }
  });
}

function renderDetailCards(){
  const key = `${latest.ym}-${latest.half}`;
  const rows = RAW.filter(r=> r.section===state.pol && r.region===state.region && r.pod===state.pod && periodKey(r)===key);
  document.getElementById('detailTag').textContent = `${periodLabel(latest)} 기준 · ${rows.length}개 선사`;

  const numeric20 = rows.filter(r=>typeof r.r20==='number').map(r=>r.r20);
  const min20 = numeric20.length ? Math.min(...numeric20) : null;

  const grid = document.getElementById('detailGrid');
  if(rows.length===0){
    grid.innerHTML = `<div class="empty-state">최신 기간(${periodLabel(latest)})에는 이 항로 데이터가 없어요.</div>`;
    return;
  }
  grid.innerHTML = rows.map(r=>{
    const isBest = min20!==null && r.r20===min20;
    return `<div class="rate-card">
      <div class="rc-head">
        <span class="rc-line">${r.line}</span>
        <div class="rc-tags">
          ${isBest ? '<span class="rc-tag best">✓ 최저가</span>':''}
          <span class="rc-tag">${r.tt||'-'}</span>
        </div>
      </div>
      <div class="rc-body">
        <div class="rc-sec-label">선임 (OCEAN FREIGHT)</div>
        <div class="rc-prices">
          <div class="rc-price-box"><div class="u">20ft</div><div class="v">${typeof r.r20==='number'?'$'+r.r20:'-'}</div></div>
          <div class="rc-price-box"><div class="u">40ft</div><div class="v">${typeof r.r40==='number'?'$'+r.r40:'-'}</div></div>
        </div>
        <div class="rc-remark">비고: ${r.remark || '별도 사항 없음'}</div>
      </div>
    </div>`;
  }).join('');
}

function renderAll(){
  buildSidebar();
  renderCards();
  renderChart();
  renderDetailCards();
}

document.getElementById('polToggle').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  state.pol = e.target.dataset.val;
  state.region = null; state.pod = null;
  renderAll();
});
document.getElementById('containerToggle').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  state.container = e.target.dataset.val;
  renderCards();
  renderChart();
});

renderAll();
</script>
</body>
</html>
