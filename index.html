<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수출입 해상운임 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0E2A3D;
    --navy-deep:#081C29;
    --teal:#1C8C8C;
    --teal-light:#E4F4F3;
    --amber:#E2A63B;
    --up:#C1443D;
    --down:#2E8B57;
    --bg:#F4F7F8;
    --surface:#FFFFFF;
    --border:#DFE6E9;
    --text:#14232B;
    --text-soft:#64798A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ===== Header ===== */
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:28px 32px 40px;
    position:relative;
    overflow:hidden;
  }
  header .wave{
    position:absolute; left:0; right:0; bottom:-2px; height:28px;
    background:var(--bg);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 40' preserveAspectRatio='none'><path d='M0,20 C150,40 350,0 600,20 C850,40 1050,0 1200,20 L1200,40 L0,40 Z'/></svg>") center/cover;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 40' preserveAspectRatio='none'><path d='M0,20 C150,40 350,0 600,20 C850,40 1050,0 1200,20 L1200,40 L0,40 Z'/></svg>") center/cover;
  }
  .header-row{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; max-width:1400px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand svg{flex-shrink:0;}
  .brand h1{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .brand p{margin:4px 0 0; font-size:13px; color:#9FB4C4;}
  .period-badge{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:999px;
    padding:8px 18px;
    font-size:13px;
    color:#CFE3EA;
    white-space:nowrap;
  }
  .period-badge b{color:#fff; font-family:'JetBrains Mono',monospace;}

  main{max-width:1400px; margin:0 auto; padding:0 24px 60px;}

  /* ===== Summary cards ===== */
  .cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:-22px;
    margin-bottom:22px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    box-shadow:0 2px 10px rgba(14,42,61,0.05);
  }
  .card .label{font-size:12px; color:var(--text-soft); margin-bottom:6px;}
  .card .value{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--navy);}
  .card .delta{font-size:12px; margin-top:4px; font-family:'JetBrains Mono',monospace;}
  .delta.up{color:var(--up);}
  .delta.down{color:var(--down);}
  .delta.flat{color:var(--text-soft);}

  /* ===== Filters ===== */
  .filters{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(14,42,61,0.04);
  }
  .filter-group{display:flex; flex-direction:column; gap:5px;}
  .filter-group label{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.04em;}
  select, input[type=text]{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
    color:var(--text);
    min-width:120px;
  }
  select:focus, input:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .toggle-group{display:flex; gap:4px; background:#EEF2F4; padding:3px; border-radius:8px;}
  .toggle-group button{
    border:none; background:transparent; padding:6px 12px; font-size:13px; border-radius:6px;
    cursor:pointer; color:var(--text-soft); font-family:'Inter',sans-serif; font-weight:500;
  }
  .toggle-group button.active{background:var(--navy); color:#fff;}
  .search-wrap{flex:1; min-width:200px;}
  .search-wrap input{width:100%;}
  .reset-btn{
    border:1px solid var(--border); background:#fff; color:var(--text-soft);
    padding:8px 14px; border-radius:7px; font-size:13px; cursor:pointer; align-self:flex-end;
  }
  .reset-btn:hover{border-color:var(--teal); color:var(--teal);}

  /* ===== Layout: table + detail ===== */
  .content-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start;}
  @media (max-width:980px){ .content-grid{grid-template-columns:1fr;} .cards{grid-template-columns:repeat(2,1fr);} }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(14,42,61,0.05);
    overflow:hidden;
  }
  .panel-head{
    padding:14px 18px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
  }
  .panel-head h2{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0; color:var(--navy);}
  .panel-head .count{font-size:12px; color:var(--text-soft); font-family:'JetBrains Mono',monospace;}

  .table-wrap{max-height:640px; overflow:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    position:sticky; top:0; background:#F8FAFB; text-align:left; padding:10px 12px;
    font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-soft);
    border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap;
  }
  thead th:hover{color:var(--teal);}
  thead th.sorted::after{content:' ▾'; color:var(--teal);}
  tbody td{padding:9px 12px; border-bottom:1px solid #EEF2F4; white-space:nowrap;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--teal-light);}
  tbody tr.selected{background:#D9EEEC;}
  .rate{font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--navy);}
  .rate.nil{color:var(--text-soft); font-weight:400;}
  .tag{
    display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
    background:#EEF2F4; color:var(--text-soft);
  }
  .tag.pol-busan{background:#E4F1FB; color:#1B5C8C;}
  .tag.pol-incheon{background:#F4EBFB; color:#6C3B9E;}

  .empty-state{
    padding:50px 24px; text-align:center; color:var(--text-soft); font-size:13px;
  }
  .empty-state svg{margin-bottom:12px; opacity:.5;}

  .detail-body{padding:18px;}
  .detail-title{font-family:'Space Grotesk',sans-serif; font-size:16px; color:var(--navy); margin:0 0 4px;}
  .detail-sub{font-size:12px; color:var(--text-soft); margin-bottom:16px;}
  .detail-remark{
    font-size:12px; color:var(--text-soft); background:#F8FAFB; border-left:3px solid var(--teal);
    padding:8px 10px; margin-top:14px; line-height:1.6;
  }
  .chart-box{height:220px; margin-top:10px;}

  footer{
    text-align:center; padding:24px; color:var(--text-soft); font-size:12px;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="20" fill="#12384F"/>
        <path d="M8 24c2.5 2 5 2 7.5 0s5-2 7.5 0 5 2 7.5 0" stroke="#5FC7C4" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 18c2.5 2 5 2 7.5 0s5-2 7.5 0 5 2 7.5 0" stroke="#E2A63B" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        <path d="M20 8v6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>수출입 해상운임 대시보드</h1>
        <p>해운팀 · Ocean Freight Rate Tracker</p>
      </div>
    </div>
    <div class="period-badge">최신 데이터 <b id="latestPeriodBadge">-</b></div>
  </div>
  <div class="wave"></div>
</header>

<main>
  <div class="cards" id="summaryCards"></div>

  <div class="filters">
    <div class="filter-group">
      <label>기준 항구</label>
      <div class="toggle-group" id="polToggle">
        <button data-val="ALL" class="active">전체</button>
        <button data-val="부산착">부산</button>
        <button data-val="인천착">인천</button>
      </div>
    </div>
    <div class="filter-group">
      <label>기간</label>
      <select id="periodSelect"></select>
    </div>
    <div class="filter-group">
      <label>지역</label>
      <select id="regionSelect"><option value="ALL">전체</option></select>
    </div>
    <div class="filter-group">
      <label>선사</label>
      <select id="lineSelect"><option value="ALL">전체</option></select>
    </div>
    <div class="search-wrap filter-group">
      <label>도착지 검색</label>
      <input type="text" id="searchInput" placeholder="예: BANGKOK, ROTTERDAM...">
    </div>
    <button class="reset-btn" id="resetBtn">필터 초기화</button>
  </div>

  <div class="content-grid">
    <div class="panel">
      <div class="panel-head">
        <h2>운임 리스트</h2>
        <span class="count" id="rowCount">0건</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-key="ym">기간</th>
              <th data-key="pol">항구</th>
              <th data-key="region">지역</th>
              <th data-key="pod">도착지</th>
              <th data-key="line">선사</th>
              <th data-key="r20">20FT</th>
              <th data-key="r40">40FT</th>
              <th data-key="tt">T/T</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="detailPanel">
      <div class="panel-head"><h2>운임 추이</h2></div>
      <div class="empty-state" id="detailEmpty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        <div>왼쪽 표에서 항로(도착지·선사)를 클릭하면<br>기간별 운임 추이를 볼 수 있어요.</div>
      </div>
      <div class="detail-body" id="detailBody" style="display:none;"></div>
    </div>
  </div>
</main>

<footer>일양익스프레스 해운팀 · 데이터 기준 2026년 1월~7월 (부산/인천 수입 운임)</footer>

지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"HUANGPU","line":"CK LINE","r20":250,"r40":500,"tt":"6~8DAY, T/S","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"HUANGPU","line":"KMTC","r20":240,"r40":480,"tt":"5~8DAY, T/S","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"HUANGPU","line":"NAMSUNG","r20":200,"r40":400,"tt":"5~8DAY, DIRECT","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"HUANGPU","line":"PAN OCEAN","r20":250,"r40":500,"tt":"5~8DAY, DIRECT","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"XIAMEN","line":"CK LINE","r20":150,"r40":300,"tt":"2DAY, DIRECT","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"XIAMEN","line":"KMTC","r20":200,"r40":400,"tt":"2DAY, DIRECT","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"XIAMEN","line":"NAMSUNG","r20":250,"r40":400,"tt":"2DAY, DIRECT","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"중국","pod":"XIAMEN","line":"PAN OCEAN","r20":200,"r40":400,"tt":"3DAY, DIRECT","remark":"선적지LSS별도 / 도착지 CAF,BAF,CIC 포함"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"일본","pod":"NAGOYA","line":"CK LINE","r20":120,"r40":240,"tt":"4DAY, T/S","remark":"도착지 BAF 별도, EBS 별도"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"일본","pod":"NAGOYA","line":"PANCON","r20":120,"r40":240,"tt":"3DAY,DIRECT","remark":"도착지 BAF 별도, EBS 별도"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"일본","pod":"TOKYO, JAPAN","line":"CK LINE","r20":120,"r40":240,"tt":"4DAY, T/S","remark":"도착지 BAF 별도, EBS 별도"},{"ym":"2026-07","half":"하","section":"인천착","pol":"INCHEON, KOREA","region":"일본","pod":"TOKYO, JAPAN","line":"PANCON","r20":120,"r40":240,"tt":"3DAY,DIRECT","remark":"도착지 BAF 별도, EBS 별도"}]</script>
<script>
const RAW = JSON.parse(document.getElementById('freight-data').textContent);

// ---- helpers ----
const halfOrder = {'상':0,'하':1};
function periodKey(r){ return r.ym + '-' + r.half; }
function periodSort(a,b){
  if(a.ym !== b.ym) return a.ym.localeCompare(b.ym);
  return halfOrder[a.half]-halfOrder[b.half];
}
const periods = [...new Map(RAW.map(r=>[periodKey(r),{ym:r.ym,half:r.half}])).values()].sort(periodSort);
const latestPeriod = periods[periods.length-1];
const prevPeriod = periods[periods.length-2];

document.getElementById('latestPeriodBadge').textContent = `${latestPeriod.ym} ${latestPeriod.half}반월`;

// populate period select (default: latest)
const periodSelect = document.getElementById('periodSelect');
periodSelect.innerHTML = '<option value="ALL">전체 기간</option>' + periods.map(p=>{
  const key = `${p.ym}-${p.half}`;
  return `<option value="${key}">${p.ym} ${p.half}반월</option>`;
}).join('');
periodSelect.value = `${latestPeriod.ym}-${latestPeriod.half}`;

// populate region / line selects
const regions = [...new Set(RAW.map(r=>r.region))].sort();
document.getElementById('regionSelect').innerHTML += regions.map(r=>`<option value="${r}">${r}</option>`).join('');
const lines = [...new Set(RAW.map(r=>r.line))].sort();
document.getElementById('lineSelect').innerHTML += lines.map(l=>`<option value="${l}">${l}</option>`).join('');

// ---- state ----
let state = { pol:'ALL', period: periodSelect.value, region:'ALL', line:'ALL', search:'', sortKey:'pod', sortDir:1 };
let selectedRow = null;
let chartInstance = null;

function applyFilters(){
  return RAW.filter(r=>{
    if(state.pol!=='ALL' && r.section!==state.pol) return false;
    if(state.period!=='ALL' && periodKey(r)!==state.period) return false;
    if(state.region!=='ALL' && r.region!==state.region) return false;
    if(state.line!=='ALL' && r.line!==state.line) return false;
    if(state.search){
      const s = state.search.toUpperCase();
      if(!(r.pod||'').toUpperCase().includes(s) && !(r.line||'').toUpperCase().includes(s)) return false;
    }
    return true;
  });
}

function fmtRate(v){
  if(v===null||v===undefined||v==='NIL'||v==='') return '<span class="rate nil">-</span>';
  return `<span class="rate">$${v}</span>`;
}

function renderTable(){
  let rows = applyFilters();
  rows.sort((a,b)=>{
    let x=a[state.sortKey], y=b[state.sortKey];
    if(state.sortKey==='ym'){ x=periodKey(a); y=periodKey(b); }
    if(x===null||x===undefined) x='';
    if(y===null||y===undefined) y='';
    if(typeof x==='number' && typeof y==='number') return (x-y)*state.sortDir;
    return String(x).localeCompare(String(y)) * state.sortDir;
  });
  document.getElementById('rowCount').textContent = rows.length.toLocaleString()+'건';
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.slice(0,500).map((r,i)=>{
    const polClass = r.section==='부산착' ? 'pol-busan':'pol-incheon';
    const polLabel = r.section==='부산착' ? '부산':'인천';
    return `<tr data-idx="${RAW.indexOf(r)}">
      <td>${r.ym} ${r.half}</td>
      <td><span class="tag ${polClass}">${polLabel}</span></td>
      <td>${r.region||''}</td>
      <td>${r.pod||''}</td>
      <td>${r.line}</td>
      <td>${fmtRate(r.r20)}</td>
      <td>${fmtRate(r.r40)}</td>
      <td style="color:var(--text-soft); font-size:12px;">${r.tt||''}</td>
    </tr>`;
  }).join('');
  [...tbody.querySelectorAll('tr')].forEach(tr=>{
    tr.addEventListener('click', ()=>{
      selectRow(parseInt(tr.dataset.idx));
      [...tbody.querySelectorAll('tr')].forEach(t=>t.classList.remove('selected'));
      tr.classList.add('selected');
    });
  });
}

function avg(arr){ const nums = arr.filter(v=>typeof v==='number'); return nums.length? nums.reduce((a,b)=>a+b,0)/nums.length : null; }

function renderCards(){
  const latestRows = RAW.filter(r=>periodKey(r)===`${latestPeriod.ym}-${latestPeriod.half}`);
  const prevRows = prevPeriod ? RAW.filter(r=>periodKey(r)===`${prevPeriod.ym}-${prevPeriod.half}`) : [];
  const laneCount = new Set(RAW.map(r=>r.pod+'|'+r.line)).size;
  const lineCount = new Set(RAW.map(r=>r.line)).size;
  const avg20 = avg(latestRows.map(r=>r.r20));
  const avg20prev = avg(prevRows.map(r=>r.r20));
  let deltaHtml = '<span class="delta flat">비교 데이터 없음</span>';
  if(avg20!==null && avg20prev){
    const diff = avg20-avg20prev;
    const pct = (diff/avg20prev*100).toFixed(1);
    const cls = diff>0?'up':(diff<0?'down':'flat');
    const arrow = diff>0?'▲':(diff<0?'▼':'-');
    deltaHtml = `<span class="delta ${cls}">${arrow} ${Math.abs(pct)}% (전기 대비)</span>`;
  }
  const cards = [
    {label:'전체 항로 수 (도착지×선사)', value: laneCount.toLocaleString(), delta:''},
    {label:'등록 선사 수', value: lineCount, delta:''},
    {label:`이번기 평균 20FT`, value: avg20? '$'+Math.round(avg20) : '-', delta:deltaHtml},
    {label:'전체 데이터 건수', value: RAW.length.toLocaleString(), delta:''}
  ];
  document.getElementById('summaryCards').innerHTML = cards.map(c=>`
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      ${c.delta || ''}
    </div>`).join('');
}

function selectRow(idx){
  const row = RAW[idx];
  selectedRow = row;
  document.getElementById('detailEmpty').style.display='none';
  const body = document.getElementById('detailBody');
  body.style.display='block';

  const history = RAW.filter(r=> r.pod===row.pod && r.line===row.line && r.section===row.section)
    .sort(periodSort);

  const polLabel = row.section==='부산착' ? '부산':'인천';
  body.innerHTML = `
    <div class="detail-title">${polLabel} → ${row.pod}</div>
    <div class="detail-sub">${row.line} · ${row.region||''} · ${row.tt||''}</div>
    <div class="chart-box"><canvas id="trendChart"></canvas></div>
    <div class="detail-remark">${row.remark || '비고 없음'}</div>
  `;

  const labels = history.map(h=>`${h.ym.slice(5)}/${h.half}`);
  const d20 = history.map(h=> typeof h.r20==='number'? h.r20 : null);
  const d40 = history.map(h=> typeof h.r40==='number'? h.r40 : null);

  if(chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('trendChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'20FT ($)', data:d20, borderColor:'#1C8C8C', backgroundColor:'#1C8C8C', tension:0.25, spanGaps:true},
        {label:'40FT ($)', data:d40, borderColor:'#0E2A3D', backgroundColor:'#0E2A3D', tension:0.25, spanGaps:true}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{font:{size:11}, boxWidth:10}}},
      scales:{ y:{ ticks:{font:{size:10}} }, x:{ ticks:{font:{size:10}} } }
    }
  });
}

// ---- events ----
document.getElementById('polToggle').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  state.pol = e.target.dataset.val;
  renderTable();
});
periodSelect.addEventListener('change', e=>{ state.period=e.target.value; renderTable(); });
document.getElementById('regionSelect').addEventListener('change', e=>{ state.region=e.target.value; renderTable(); });
document.getElementById('lineSelect').addEventListener('change', e=>{ state.line=e.target.value; renderTable(); });
document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value; renderTable(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = { pol:'ALL', period: `${latestPeriod.ym}-${latestPeriod.half}`, region:'ALL', line:'ALL', search:'', sortKey:'pod', sortDir:1 };
  document.getElementById('polToggle').children[0].click();
  periodSelect.value = state.period;
  document.getElementById('regionSelect').value='ALL';
  document.getElementById('lineSelect').value='ALL';
  document.getElementById('searchInput').value='';
  renderTable();
});
document.querySelectorAll('thead th').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(state.sortKey===key){ state.sortDir*=-1; } else { state.sortKey=key; state.sortDir=1; }
    document.querySelectorAll('thead th').forEach(t=>t.classList.remove('sorted'));
    th.classList.add('sorted');
    renderTable();
  });
});

renderCards();
renderTable();
</script>
</body>
</html>
